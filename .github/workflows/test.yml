name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ARTIFACT_DIR: test-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      - run: xvfb-run -a node tests/browser.cjs
      - run: npm run test:package
      - run: npm run package
      - name: Extract tested package
        run: python3 -c "import glob,zipfile; archives=glob.glob('dist/xdeporter-v*.zip'); assert len(archives)==1; zipfile.ZipFile(archives[0]).extractall('dist/unpacked')"
      - name: Test the packaged extension in Chromium
        run: xvfb-run -a node tests/security-browser.cjs
        env:
          SECURITY_EXTENSION_DIR: dist/unpacked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
